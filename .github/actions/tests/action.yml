name: tests
description: tests

runs:
  using: 'composite'
  steps:

    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install uv (with cache)
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock

    - name: Sync dependencies (dev)
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
        git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
        uv sync --frozen

    - name: Run tests
      shell: bash
      run: uv run pytest -q